<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // WindowClient.navigate() navigates a window client that the worker controls, and resolves with the window client
    // of the new document, or with null if that is cross-origin. It rejects for a client the worker does not control
    // and for URLs that cannot be navigated to.
    promiseTest(async () => {
        const server = httpTestServer();
        const script = await server.createEcho("GET", "/worker.js", {
            status: 200,
            headers: { "Content-Type": "text/javascript" },
            body: `self.addEventListener("message", event => {
                const { clientURL, url } = event.data;
                event.waitUntil(self.clients.matchAll({ includeUncontrolled: true }).then(async clients => {
                    const client = clients.find(client => client.url === clientURL);
                    let result;
                    try {
                        const navigated = await client.navigate(url);
                        result = navigated === null ? "null" : \`WindowClient \${navigated.url}, frameType \${navigated.frameType}, a new id: \${navigated.id !== client.id}\`;
                    } catch (error) {
                        result = error.name;
                    }
                    event.source.postMessage(result);
                }));
            });`,
        });
        const page = body => server.createEcho("GET", `/${Math.random().toString(36).slice(2)}.html`, {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body,
        });
        const firstURL = await page("<!DOCTYPE html><p>First</p>");
        const secondURL = await page("<!DOCTYPE html><p>Second</p>");

        const registration = await navigator.serviceWorker.register(script);
        const worker = registration.installing;
        await waitForCondition(() => worker.state === "activated");

        const frame = document.createElement("iframe");
        let loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        frame.src = firstURL;
        document.body.appendChild(frame);
        await loaded;

        const navigate = (clientURL, url) => new Promise(resolve => {
            navigator.serviceWorker.addEventListener("message", event => resolve(event.data), { once: true });
            worker.postMessage({ clientURL, url });
        });

        loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        const result = await navigate(firstURL, secondURL);
        println(`navigate() to a URL in scope: ${result.replace(secondURL, "<second URL>")}`);
        await loaded;
        println(`The frame shows: ${frame.contentDocument.body.textContent}`);
        println(`The new document is controlled: ${frame.contentWindow.navigator.serviceWorker.controller !== null}`);

        println(`navigate() to about:blank: ${await navigate(secondURL, "about:blank")}`);
        println(`navigate() to an invalid URL: ${await navigate(secondURL, "http://[example].com")}`);
        println(`navigate() of a client the worker does not control: ${await navigate(location.href, secondURL)}`);

        const crossOriginURL = new URL(firstURL);
        crossOriginURL.hostname = "127.0.0.1";
        println(`navigate() to a cross-origin URL: ${await navigate(secondURL, crossOriginURL.href)}`);

        frame.remove();
        println(`unregister(): ${await registration.unregister()}`);
    });
</script>
