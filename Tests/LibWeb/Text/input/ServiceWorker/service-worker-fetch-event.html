<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // A controlled client's fetches dispatch fetch events at its active service worker, which can respond, let the
    // fetch go to the network, or make it fail.
    promiseTest(async () => {
        const server = httpTestServer();
        const script = await server.createEcho("GET", "/worker.js", {
            status: 200,
            headers: { "Content-Type": "text/javascript" },
            body: `self.addEventListener("fetch", event => {
                const url = new URL(event.request.url);
                const kind = url.searchParams.get("kind");
                if (kind === "respond")
                    event.respondWith(new Response("Hello from the service worker, " + event.request.method + " " + url.pathname.split("/").pop(), { status: 201, statusText: "Made", headers: { "X-From": "service-worker" } }));
                else if (kind === "error")
                    event.respondWith(Response.error());
                else if (kind === "reject")
                    event.respondWith(Promise.reject(new Error("Rejected")));
                else if (kind === "not-a-response")
                    event.respondWith(Promise.resolve("Not a response"));
                else if (kind === "cancel")
                    event.preventDefault();
                else if (kind === "echo-body")
                    event.respondWith(event.request.text().then(body => new Response("Body was: " + body)));
            });`,
        });
        const frameURL = await server.createEcho("GET", "/frame.html", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: "<!DOCTYPE html><p>In scope</p>",
        });
        const dataURL = await server.createEcho("GET", "/data.txt", {
            status: 200,
            headers: { "Content-Type": "text/plain" },
            body: "From the network",
        });

        const registration = await navigator.serviceWorker.register(script);
        const worker = registration.installing;
        await waitForCondition(() => worker.state === "activated");

        const frame = document.createElement("iframe");
        const loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        frame.src = frameURL;
        document.body.appendChild(frame);
        await loaded;
        const frameFetch = frame.contentWindow.fetch.bind(frame.contentWindow);

        const describe = async (kind, init) => {
            try {
                const response = await frameFetch(`${dataURL}?kind=${kind}`, init);
                return `${response.status} ${response.statusText} ${response.headers.get("X-From")} "${await response.text()}"`;
            } catch (error) {
                return error.name;
            }
        };
        println(`respondWith(Response): ${await describe("respond")}`);
        println(`No respondWith(): ${await describe("none")}`);
        println(`respondWith(Response.error()): ${await describe("error")}`);
        println(`respondWith() a rejected promise: ${await describe("reject")}`);
        println(`respondWith() something else: ${await describe("not-a-response")}`);
        println(`preventDefault() without respondWith(): ${await describe("cancel")}`);
        println(`respondWith() with the request's body: ${await describe("echo-body", { method: "POST", body: "posted text" })}`);

        frame.remove();
        println(`unregister(): ${await registration.unregister()}`);
    });
</script>
