<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const server = httpTestServer();
        const script = await server.createEcho("GET", "/worker.js", {
            status: 200,
            headers: { "Content-Type": "text/javascript", "Service-Worker-Allowed": "/" },
            body: `self.addEventListener("install", () => {}); self.addEventListener("activate", () => {});`,
        });
        const describe = worker => (worker ? worker.state : "null");

        const registration = await navigator.serviceWorker.register(script, { scope: "./" });
        const worker = registration.installing;
        println(`register() resolved, installing: ${describe(worker)}, waiting: ${describe(registration.waiting)}, active: ${describe(registration.active)}`);
        println(`scriptURL: ${worker.scriptURL === script}`);

        const updateFound = new Promise(resolve => registration.addEventListener("updatefound", () => resolve(registration.installing === worker), { once: true }));
        const states = [];
        const redundant = new Promise(resolve => {
            worker.addEventListener("statechange", () => {
                states.push(`${worker.state} (installing: ${describe(registration.installing)}, waiting: ${describe(registration.waiting)}, active: ${describe(registration.active)})`);
                if (worker.state === "redundant")
                    resolve();
            });
        });
        println(`updatefound fired with the installing worker: ${await updateFound}`);

        const ready = await navigator.serviceWorker.ready;
        println(`ready resolved with the registration: ${ready === registration}`);
        println(`ready registration's active worker: ${ready.active === worker}`);
        await waitForCondition(() => worker.state === "activated");

        println(`unregister(): ${await registration.unregister()}`);
        println(`unregister() again: ${await registration.unregister()}`);
        await redundant;
        println(`getRegistrations() afterwards: ${(await navigator.serviceWorker.getRegistrations()).length}`);

        println("State changes:");
        for (const state of states)
            println(`  ${state}`);
    });
</script>
