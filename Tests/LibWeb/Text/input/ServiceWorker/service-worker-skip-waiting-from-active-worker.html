<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // The active worker calls skipWaiting() while a waiting worker can replace it, so the call activates the waiting
    // worker and terminates the worker that made it.
    promiseTest(async () => {
        const server = httpTestServer();
        const javascript = { "Content-Type": "text/javascript" };
        const channelName = "service-worker-skip-waiting-from-active-worker";

        // NB: The first worker holds its activate event until the page posts to the channel, so that the second worker
        //     installs and waits meanwhile. Once the event ends, it calls skipWaiting() from a task of its own.
        const first = await server.createEcho("GET", "/skip-waiting-from-active-worker/first.js", {
            status: 200,
            headers: javascript,
            body: `const channel = new BroadcastChannel("${channelName}");
            self.addEventListener("activate", event => event.waitUntil(new Promise(resolve => {
                channel.onmessage = () => {
                    resolve();
                    setTimeout(() => self.skipWaiting(), 0);
                };
            })));`,
        });
        const second = await server.createEcho("GET", "/skip-waiting-from-active-worker/second.js", { status: 200, headers: javascript, body: "" });

        const registration = await navigator.serviceWorker.register(first);
        const firstWorker = registration.installing;
        await waitForCondition(() => firstWorker.state === "activating");
        const secondWorker = (await navigator.serviceWorker.register(second)).installing;
        await waitForCondition(() => secondWorker.state === "installed");
        println(`While the first worker activates: first is ${firstWorker.state}, second is ${secondWorker.state}`);

        new BroadcastChannel(channelName).postMessage("finish activating");
        await waitForCondition(() => secondWorker.state === "activated");
        println(`After the first worker calls skipWaiting(): first is ${firstWorker.state}, second is ${secondWorker.state}`);
        println(`Active worker is the second: ${registration.active === secondWorker}`);
        println(`unregister(): ${await registration.unregister()}`);
    });
</script>
