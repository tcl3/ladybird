<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const server = httpTestServer();
        const script = await server.createEcho("GET", "/worker.js", {
            status: 200,
            headers: { "Content-Type": "text/javascript" },
            body: `self.addEventListener("message", event => {
                const source = event.source;
                source.postMessage({
                    data: event.data,
                    origin: event.origin,
                    isExtendableMessageEvent: event instanceof ExtendableMessageEvent,
                    isTrusted: event.isTrusted,
                    sourceInterface: source.constructor.name,
                    sourceType: source.type,
                    sourceFrameType: source.frameType,
                    sourceURL: source.url,
                    sourceIdIsString: typeof source.id === "string" && source.id.length > 0,
                    sourceVisibilityState: source.visibilityState,
                    sameSourceObject: event.source === source,
                    ports: event.ports.length,
                    portsFrozen: Object.isFrozen(event.ports),
                });
            });`,
        });

        const registration = await navigator.serviceWorker.register(script);
        const worker = registration.installing;
        await waitForCondition(() => worker.state === "activated");

        const reply = new Promise(resolve => navigator.serviceWorker.addEventListener("message", resolve, { once: true }));
        worker.postMessage({ greeting: "hello" });
        const event = await reply;
        println(`Reply is a MessageEvent: ${event instanceof MessageEvent}`);
        println(`Reply source is the worker: ${event.source === registration.active}`);
        println(`Reply origin is this origin: ${event.origin === location.origin}`);

        const result = event.data;
        println(`Data: ${JSON.stringify(result.data)}`);
        println(`Origin is this origin: ${result.origin === location.origin}`);
        println(`ExtendableMessageEvent: ${result.isExtendableMessageEvent}`);
        println(`isTrusted: ${result.isTrusted}`);
        println(`Source interface: ${result.sourceInterface}`);
        println(`Source type: ${result.sourceType}`);
        println(`Source frame type: ${result.sourceFrameType}`);
        println(`Source URL is this page: ${result.sourceURL === location.href}`);
        println(`Source id is a string: ${result.sourceIdIsString}`);
        println(`Source visibility state: ${result.sourceVisibilityState}`);
        println(`Ports: ${result.ports}, frozen: ${result.portsFrozen}`);
    });
</script>
