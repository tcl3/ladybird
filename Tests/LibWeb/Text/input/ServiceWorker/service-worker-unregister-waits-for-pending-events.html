<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // An unregistered registration is cleared only once its worker's message events are no longer extended.
    promiseTest(async () => {
        const server = httpTestServer();
        const script = await server.createEcho("GET", "/worker.js", {
            status: 200,
            headers: { "Content-Type": "text/javascript" },
            body: `let release;
            self.addEventListener("message", event => {
                if (event.data === "hold")
                    event.waitUntil(new Promise(resolve => (release = resolve)));
                else if (event.data === "release")
                    release();
                event.source.postMessage(event.data);
            });`,
        });

        const registration = await navigator.serviceWorker.register(script);
        const worker = registration.installing;
        await waitForCondition(() => worker.state === "activated");
        const states = [];
        worker.addEventListener("statechange", () => states.push(worker.state));
        const send = message => new Promise(resolve => {
            navigator.serviceWorker.addEventListener("message", event => resolve(event.data), { once: true });
            worker.postMessage(message);
        });

        await send("hold");
        println(`unregister(): ${await registration.unregister()}`);
        println(`Registration afterwards: ${await navigator.serviceWorker.getRegistration(registration.scope)}`);
        await send("ping");
        println(`Worker while its message event is extended: ${worker.state}`);

        await send("release");
        await waitForCondition(() => worker.state === "redundant");
        println(`State changes after the release: ${states.join(", ")}`);
    });
</script>
