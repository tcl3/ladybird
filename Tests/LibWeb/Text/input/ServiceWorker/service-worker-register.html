<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        try {
            const registration = await navigator.serviceWorker.register("service-worker.js");
            println(`ServiceWorker registration successful with scope: ${registration.scope === new URL("./", location.href).href}`);
        } catch (error) {
            println(`ServiceWorker registration failed: ${error.name}`);
        }
    });
</script>
