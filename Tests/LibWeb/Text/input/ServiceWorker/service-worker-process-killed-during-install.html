<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // A worker whose process dies while it installs fails to install.
    promiseTest(async () => {
        const server = httpTestServer();
        const script = await server.createEcho("GET", "/worker.js", {
            status: 200,
            headers: { "Content-Type": "text/javascript" },
            body: `self.addEventListener("install", event => event.waitUntil(new Promise(() => {})));`,
        });

        const registration = await navigator.serviceWorker.register(script);
        const worker = registration.installing;
        const redundant = new Promise(resolve => worker.addEventListener("statechange", () => worker.state === "redundant" && resolve()));
        internals.killServiceWorkerProcess(worker);
        await redundant;
        println(`Worker: ${worker.state}`);
        println(`Registration afterwards: ${await navigator.serviceWorker.getRegistration(registration.scope)}`);
    });
</script>
